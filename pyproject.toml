[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specialmeasures"
version = "0.1.0"
description = "Machine-readable FinCEN special measures (section 311, section 9714, FEND Off Fentanyl 2313a) with Federal Register citations, status on any date, and counterparty screening. Engineering checklist, not legal advice."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Art Akopian", email = "opensource@banrox.com" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["aml", "fincen", "section-311", "special-measures", "sanctions-screening", "bsa", "fintech"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "hypothesis>=6.100"]

[project.urls]
Homepage = "https://banrox.com"
Source = "https://github.com/BanroxArt/special-measures"

[project.scripts]
specialmeasures = "specialmeasures.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
specialmeasures = ["py.typed", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unreachable = true
